
name: Publish

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          package-manager-cache: false

      - name: Check npm version
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Publish to npm
        run: npm publish --access public
